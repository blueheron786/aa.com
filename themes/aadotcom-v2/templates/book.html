<article class="book-page">
    <!-- Content from the markdown file will be inserted here -->
    {{content}}
</article>

<style>
.book-page {
    max-width: 800px;
    margin: 0 auto;
    padding: 2rem;
}

.book-cover {
    text-align: center;
    margin: 2rem 0;
}

.book-cover img {
    max-width: 300px;
    height: auto;
    border-radius: 8px;
    box-shadow: 0 4px 8px rgba(0,0,0,0.1);
}

.buy-button {
    display: inline-block;
    background: #007acc;
    color: white;
    padding: 12px 24px;
    text-decoration: none;
    border-radius: 6px;
    font-weight: bold;
    transition: background-color 0.3s;
}

.buy-button:hover {
    background: #005a9e;
}

.cta {
    text-align: center;
    margin: 2rem 0;
}
</style>
