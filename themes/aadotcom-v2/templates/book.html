<article class="book-page">
<header>
    <h1>{{title}}</h1>
    <div class="book-cover">
        <img src="/images/covers/{{cover}}" alt="{{title}} Cover">
    </div>
</header>

<section class="book-description">
    {{content}}
</section>

<div class="cta">
    <h2 style="text-align: center;"><a href="{{buy_link}}" class="buy-button">Buy Now</a></h2>
</div>
</article>
