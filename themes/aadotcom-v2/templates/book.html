<article class="book-page">
<header>
    <h1>{{title}}</h1>
    <div class="book-cover">
        <img src="/images/covers/{{cover}}" alt="{{title}} Cover">
    </div>
</header>

<section class="book-description">
    {{content}}
</section>

<div class="cta">
    <a href="{{buy_link}}" class="buy-button">Buy Now</a>
</div>
</article>

<style>
.book-page {
    max-width: 800px;
    margin: 0 auto;
    padding: 2rem;
}

.book-cover {
    text-align: center;
    margin: 2rem 0;
}

.book-cover img {
    max-width: 300px;
    height: auto;
    border-radius: 8px;
    box-shadow: 0 4px 8px rgba(0,0,0,0.1);
}

.buy-button {
    display: inline-block;
    background: #007acc;
    color: white;
    padding: 12px 24px;
    text-decoration: none;
    border-radius: 6px;
    font-weight: bold;
    transition: background-color 0.3s;
}

.buy-button:hover {
    background: #005a9e;
}

.cta {
    text-align: center;
    margin: 2rem 0;
}
</style>
